[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gravsim"
version = "0.1.0"
description = "Simulateur gravitationnel 2D à N corps, avec analyse spectrale du mouvement stellaire"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Florian DELRIEU" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]
dev = [
    "pytest>=8",
]
build = [
    "pyinstaller>=6",
]

[project.scripts]
gravsim = "gravsim.gui.main_window:main"

[tool.setuptools.packages.find]
include = ["gravsim*"]

[tool.setuptools.package-data]
"gravsim.presets" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests longs (longues intégrations, campagnes)",
]
